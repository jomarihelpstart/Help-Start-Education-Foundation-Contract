<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Workspace & Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* --- PROFESSIONAL STYLING --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f8fafc; color: #1e293b; overflow: hidden; }
        
        /* Sidebars */
        .sidebar { width: 320px; background: #ffffff; padding: 24px; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 24px; box-shadow: 2px 0 10px rgba(0,0,0,0.02); z-index: 10; }
        .right-sidebar { width: 320px; background: #ffffff; padding: 24px; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow-y: auto; box-shadow: -2px 0 10px rgba(0,0,0,0.02); z-index: 10; }
        
        /* Workspace */
        .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(#cbd5e1 1px, transparent 0); background-size: 20px 20px; }
        .workspace { flex: 1; padding: 40px; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
        
        /* Image & Text Editor */
        .image-container { position: relative; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); background: white; border-radius: 4px; border: 1px solid #cbd5e1; display: none; }
        .image-container img { max-width: 100%; display: block; border-radius: 4px; }
        .text-overlay { position: absolute; padding: 4px 8px; font-weight: 600; color: #0f172a; cursor: move; border: 1px dashed transparent; min-width: 50px; background: transparent; }
        .text-overlay:focus { outline: none; background: rgba(255, 255, 255, 0.9); border: 1px dashed #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        
        /* Controls & Inputs */
        h3 { font-size: 14px; text-transform: uppercase; color: #64748b; margin: 0 0 12px 0; letter-spacing: 0.5px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
        input[type="text"], select, input[type="file"] { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 14px; }
        .btn { padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-family: 'Inter', sans-serif; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn.outline { background: transparent; border: 1px solid #2563eb; color: #2563eb; }
        .btn.outline:hover { background: #eff6ff; }
        
        /* Folder Directory */
        .folder-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 8px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
        .folder-item:hover { border-color: #94a3b8; transform: translateY(-1px); }
        .folder-item.active { background: #eff6ff; border-color: #3b82f6; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.1); }
        .folder-name { font-weight: 600; font-size: 14px; color: #0f172a; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .folder-meta { font-size: 12px; color: #64748b; display: flex; flex-direction: column; gap: 4px; }
        .badge { background: #e0f2fe; color: #0284c7; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
        
        hr { border: none; border-top: 1px solid #e2e8f0; margin: 20px 0; }
    <style>
<head>
<body>

<div class="sidebar">
    <div>
        <h3>1. Active Editor</h3>
        <div class="input-group">
            <select id="editorSelect">
                <option value="Jomari">Jomari</option>
            </select>
        </div>
        <div class="input-group">
            <input type="text" id="newEditorInput" placeholder="Add new name...">
            <button class="btn outline" id="addEditorBtn">Add</button>
        </div>
    </div>
    <hr>
    <div>
        <h3>2. Upload Document</h3>
        <input type="file" id="fileUpload" accept="image/png, image/jpeg">
    </div>
    <hr>
    <div>
        <h3>3. Export File</h3>
        <div class="input-group">
            <select id="exportFormat">
                <option value="png">PNG Image<option>
                <option value="jpeg">JPEG Image<option>
                <option value="pdf">PDF Document<option>
            <select>
        <div>
        <button class="btn" id="downloadBtn" style="width: 100%;">Download Now<button>
    <div>
<div>

div class="main-area"
    div class="workspace" id="workspace"
        h2 id="noFileText" style="color: #94a3b8; font-weight: 400;">Upload or select a file to start editing h2
        
        div class="image-container" id="imageContainer"
            img id="mainImage" src="" alt="Working Document"
        div
    div
div
div class="right-sidebar"
    h3 Project Directory h3
    div id="directoryList"
        div
div

<script>
    // --- STATE MANAGEMENT ---
    let filesData = [];
    let activeFileId = null;

    // --- ELEMENTS ---
    const editorSelect = document.getElementById('editorSelect');
    const newEditorInput = document.getElementById('newEditorInput');
    const addEditorBtn = document.getElementById('addEditorBtn');
    const fileUpload = document.getElementById('fileUpload');
    const directoryList = document.getElementById('directoryList');
    const imageContainer = document.getElementById('imageContainer');
    const mainImage = document.getElementById('mainImage');
    const noFileText = document.getElementById('noFileText');
    const downloadBtn = document.getElementById('downloadBtn');
    const exportFormat = document.getElementById('exportFormat');

    // --- 1. ADD NEW EDITOR ---
    addEditorBtn.addEventListener('click', () => {
        const newName = newEditorInput.value.trim();
        if (newName) {
            const option = document.createElement('option');
            option.value = newName;
            option.textContent = newName;
            editorSelect.appendChild(option);
            editorSelect.value = newName; // Auto-select yung bagong add
            newEditorInput.value = '';
        }
    });

    // --- 2. UPLOAD FILE ---
    fileUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const currentDate = new Date();
            // Format: e.g., "15 October 2023"
            const formattedDate = currentDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            
            const newFile = {
                id: 'doc_' + Date.now(),
                name: file.name,
                src: event.target.result,
                createdBy: editorSelect.value,
                lastEditedBy: editorSelect.value,
                date: formattedDate,
                time: currentDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            
            filesData.push(newFile);
            switchToFile(newFile.id);
        };
        reader.readAsDataURL(file);
    });

    // --- 3. SWITCH FILE ---
    function switchToFile(id) {
        activeFileId = id;
        const file = filesData.find(f => f.id === id);
        
        mainImage.src = file.src;
        imageContainer.style.display = 'inline-block';
        noFileText.style.display = 'none';
        
        // Linisin ang mga lumang text pag lumipat ng file (Para sa simpleng version, hindi na muna natin isinave ang coordinates ng text para hindi mag-crash, fresh overlay every switch)
        document.querySelectorAll('.text-overlay').forEach(el => el.remove());

        renderDirectory();
    }

    // --- 4. RENDER DIRECTORY (Folders) ---
    function renderDirectory() {
        directoryList.innerHTML = '';
        filesData.forEach(file => {
            const folderDiv = document.createElement('div');
            folderDiv.className = `folder-item ${file.id === activeFileId ? 'active' : ''}`;
            folderDiv.onclick = () => switchToFile(file.id);
            
            folderDiv.innerHTML = `
                <div class="folder-name">📁 ${file.name}</div>
                <div class="folder-meta">
                    <span><span class="badge">Created by</span> ${file.createdBy}</span>
                    <span><span class="badge">Last Edit</span> ${file.lastEditedBy}</span>
                    <span style="margin-top: 4px; color: #0f172a;">📅 ${file.date} at ${file.time}</span>
                </div>
            `;
            directoryList.appendChild(folderDiv);
        });
    }

    // --- 5. ADD TEXT TO IMAGE ---
    imageContainer.addEventListener('click', (e) => {
        // Siguraduhin na sa mismong image o container nag-click, hindi sa existing text
        if (e.target !== imageContainer && e.target !== mainImage) return;
        if (!activeFileId) return;

        const rect = imageContainer.getBoundingClientRect();
        const textDiv = document.createElement('div');
        textDiv.className = 'text-overlay';
        textDiv.contentEditable = 'true';
        textDiv.innerText = 'Type here...';
        
        // Kalkulahin ang position
        textDiv.style.left = (e.clientX - rect.left) + 'px';
        textDiv.style.top = (e.clientY - rect.top) + 'px';
        
        // Pagkatapos mag-type, i-update ang "Last Edited By"
        textDiv.addEventListener('blur', () => {
            const file = filesData.find(f => f.id === activeFileId);
            if (file) {
                file.lastEditedBy = editorSelect.value;
                file.time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                renderDirectory();
            }
        });

        imageContainer.appendChild(textDiv);
        textDiv.focus();
    });

    // --- 6. EXPORTING / DOWNLOADING ---
    downloadBtn.addEventListener('click', () => {
        if (!activeFileId) return alert("Please select or upload a document first.");
        
        const format = exportFormat.value;
        const currentFile = filesData.find(f => f.id === activeFileId);
        const fileName = currentFile.name.split('.')[0]; // Kunin ang pangalan walang extension

        // Gagamitin natin ang html2canvas para kunin ang picture KASAMA ang text
        html2canvas(imageContainer, { useCORS: true, backgroundColor: null }).then(canvas => {
            if (format === 'pdf') {
                // PDF Export logic
                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: canvas.width > canvas.height ? 'l' : 'p', unit: 'px', format: [canvas.width, canvas.height] });
                pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
                pdf.save(`${fileName}_Exported.pdf`);
            } else {
                // PNG / JPEG Export logic
                const link = document.createElement('a');
                link.download = `${fileName}_Exported.${format}`;
                link.href = canvas.toDataURL(`image/${format}`, 1.0);
                link.click();
            }
        });
    });

</script>
</body>
</html>
