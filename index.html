<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Collaborative Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; background-color: #f8fafc; display: flex; height: 100vh; overflow: hidden; color: #334155; }
        .left-sidebar { width: 320px; background-color: #ffffff; padding: 24px; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 24px; z-index: 10; overflow-y: auto; }
        .right-sidebar { width: 280px; background-color: #ffffff; padding: 24px; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 16px; z-index: 10; }
        .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .workspace { flex: 1; padding: 40px; display: flex; justify-content: center; align-items: flex-start; overflow: auto; background-color: #f1f5f9; }
        .image-wrapper { position: relative; display: inline-block; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); background-color: white; line-height: 0; cursor: crosshair; border-radius: 4px; border: 1px solid #cbd5e1; }
        .image-wrapper img { max-width: 100%; height: auto; display: block; pointer-events: none; user-select: none; border-radius: 3px; }
        .text-overlay { position: absolute; padding: 4px 8px; font-family: 'Inter', Arial, sans-serif; font-weight: 600; background: transparent; border: 1px dashed transparent; cursor: move; min-width: 30px; outline: none; border-radius: 4px; user-select: none; }
        .text-overlay:focus { background: rgba(255, 255, 255, 0.9); border: 1px solid #2563eb; cursor: text; }
        .user-badge { position: absolute; top: -20px; left: -1px; padding: 2px 6px; background-color: #2563eb; color: white; border-radius: 3px; font-size: 11px; font-weight: 600; pointer-events: none; }
        h2 { margin-top: 0; color: #0f172a; font-size: 13px; text-transform: uppercase; margin-bottom: 12px; }
        input, select { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { font-family: 'Inter', sans-serif; padding: 8px 12px; border-radius: 6px; cursor: pointer; border: 1px solid #cbd5e1; background: white; }
        .btn-primary { background-color: #2563eb; color: white; border: none; width: 100%; padding: 12px; }
        .file-list { display: flex; flex-direction: column; gap: 2px; }
        .file-item { display: flex; justify-content: space-between; padding: 8px 12px; cursor: pointer; border-radius: 6px; }
        .file-item:hover { background-color: #f8fafc; }
        .live-status { font-size: 12px; color: #059669; background: #ecfdf5; padding: 8px; border-radius: 6px; border: 1px solid #a7f3d0; }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            .left-sidebar, .right-sidebar { width: 100%; height: auto; }
            .main-area { flex: none; height: 500px; }
        }
    </style>
</head>
<body>
    <div class="left-sidebar">
        <div id="statusIndicator" class="live-status">System Synced Online</div>
        <div class="control-group">
            <h2>Document Upload</h2>
            <input type="file" id="imageInput" accept="image/*, application/pdf" multiple>
        </div>
    </div>
    <div class="main-area">
        <div class="workspace" id="workspace">
            <div id="noFileText">Upload a file to begin...</div>
            <div class="image-wrapper" id="imageWrapper" style="display: none;">
                <img id="mainImage" src="" alt="Active File">
            </div>
        </div>
    </div>
    <div class="right-sidebar">
        <h2>Directory</h2>
        <div class="file-list" id="fileList"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        const imageInput = document.getElementById('imageInput');
        const imageWrapper = document.getElementById('imageWrapper');
        const mainImage = document.getElementById('mainImage');
        const fileListContainer = document.getElementById('fileList');
        let filesArray = [];
        let activeFileId = null;

        // Simplified logic to prevent errors
        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const fileId = 'file_' + Date.now();
                filesArray.push({ id: fileId, name: file.name, src: event.target.result, texts: [] });
                activeFileId = fileId;
                mainImage.src = event.target.result;
                imageWrapper.style.display = 'inline-block';
                document.getElementById('noFileText').style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
        
        // Add basic functionality for export logic stub to avoid errors
        function renderFileWithTextsToDataUrl(file, mime) { return new Promise(resolve => resolve(file.src)); }
    </script>
</body>
</html>
