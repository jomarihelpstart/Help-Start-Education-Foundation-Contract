<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Start Collaborative Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; background-color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout */
        .sidebar { width: 300px; background: white; padding: 20px; border-right: 1px solid #e2e8f0; overflow-y: auto; }
        .main-area { flex: 1; padding: 20px; overflow: auto; background: #f1f5f9; display: flex; justify-content: center; }
        
        /* Responsive Mobile Fix */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 300px; }
            .main-area { height: 100vh; }
        }

        .workspace { position: relative; background: white; padding: 20px; min-width: 500px; min-height: 700px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .text-overlay { position: absolute; padding: 5px; cursor: move; border: 1px dashed #ccc; min-width: 50px; }
        input, button { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .btn-primary { background: #2563eb; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="sidebar">
    <div id="statusIndicator" style="color: red; margin-bottom: 10px;">🔴 Offline</div>
    <h2>Upload Document</h2>
    <input type="file" id="imageInput" accept="image/*">
    <hr>
    <div id="fileList"></div>
</div>

<div class="main-area">
    <div class="workspace" id="workspace">
        <div id="imageWrapper" style="position:relative;">
            <img id="mainImage" src="" style="max-width: 100%;">
        </div>
    </div>
</div>

<script>
    // 1. SUPABASE SETUP (Ilagay mo ulit ang keys mo dito)
    const SUPABASE_URL = "https://iqmjdlzxtpqbsfolnmzt.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_VSag97uggtdGwBlZvXuPbw_jTCNeDPc";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const channel = supabase.channel('room-1');

    // 2. REAL-TIME LISTENING
    channel.on('broadcast', { event: 'update' }, (payload) => {
        // Kapag may nakatanggap ng update mula sa ibang device
        updateUI(payload.data);
    }).subscribe((status) => {
        if(status === 'SUBSCRIBED') {
            document.getElementById('statusIndicator').innerText = "🟢 Online";
            document.getElementById('statusIndicator').style.color = "green";
        }
    });

    // 3. LOGIC PARA SA BROADCAST
    function sendUpdate(data) {
        channel.send({ type: 'broadcast', event: 'update', data: data });
    }

    // 4. UPLOAD LOGIC
    document.getElementById('imageInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
            const data = event.target.result;
            document.getElementById('mainImage').src = data;
            // I-broadcast sa iba
            sendUpdate({ imageSrc: data });
        };
        reader.readAsDataURL(file);
    });

    function updateUI(data) {
        if(data.imageSrc) {
            document.getElementById('mainImage').src = data.imageSrc;
        }
    }
</script>
</body>
</html>
