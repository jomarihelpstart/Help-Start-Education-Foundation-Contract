<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Collaborative Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; background-color: #f8fafc; display: flex; height: 100vh; overflow: hidden; color: #334155; }
        .left-sidebar { width: 320px; background-color: #ffffff; padding: 24px; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; }
        .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .workspace { flex: 1; padding: 40px; display: flex; justify-content: center; align-items: flex-start; overflow: auto; background-color: #f1f5f9; }
        .right-sidebar { width: 280px; background-color: #ffffff; padding: 24px; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 16px; z-index: 10; }
        
        .image-wrapper { position: relative; display: inline-block; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); background-color: white; line-height: 0; cursor: crosshair; border-radius: 4px; border: 1px solid #cbd5e1; }
        .image-wrapper img { max-width: 100%; height: auto; display: block; }
        
        .text-overlay { position: absolute; padding: 4px 8px; font-family: 'Inter', sans-serif; font-weight: 600; cursor: move; border: 1px dashed transparent; }
        .text-overlay:focus { background: rgba(255, 255, 255, 0.9); border: 1px solid #2563eb; }
        
        h2 { color: #0f172a; font-size: 13px; text-transform: uppercase; margin-bottom: 12px; }
        .file-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
        .file-item:hover { background-color: #f8fafc; }
        .file-item.active { background-color: #eff6ff; border-color: #bfdbfe; }
        .file-name { font-size: 13px; font-weight: 500; color: #334155; }
        .file-editor { font-size: 10px; color: #2563eb; display: block; margin-top: 2px; }
        .live-status { font-size: 12px; color: #059669; background: #ecfdf5; padding: 8px; border-radius: 6px; border: 1px solid #a7f3d0; }
        .divider { height: 1px; background-color: #e2e8f0; margin: 8px 0; }
    </style>
</head>
<body>

<div class="left-sidebar">
    <div id="statusIndicator" class="live-status">System Synced Online</div>
    <div class="control-group">
        <h2>Active User</h2>
        <select id="activeUser" style="width: 100%; padding: 8px;"><option value="Jomari">Jomari</option></select>
    </div>
    <div class="divider"></div>
    <div class="control-group">
        <h2>Document Upload</h2>
        <input type="file" id="imageInput" accept="image/png, image/jpeg, application/pdf" multiple>
    </div>
    <div class="divider"></div>
    <div class="control-group">
        <h2>Export System</h2>
        <button id="downloadBtn" style="width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer;">Download PDF</button>
    </div>
</div>

<div class="main-area">
    <div class="workspace" id="workspace">
        <div id="noFileText" style="color: #94a3b8;">No document selected.</div>
        <div class="image-wrapper" id="imageWrapper" style="display: none;">
            <img id="mainImage" src="" alt="Workspace">
        </div>
    </div>
</div>

<div class="right-sidebar">
    <h2>Directory</h2>
    <div class="file-list" id="fileList"></div>
</div>

<canvas id="hiddenCanvas" style="display: none;"></canvas>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    
    let filesArray = []; 
    let activeFileId = null;
    const activeUserSelect = document.getElementById('activeUser');
    const imageInput = document.getElementById('imageInput');
    const fileListContainer = document.getElementById('fileList');
    const imageWrapper = document.getElementById('imageWrapper');
    const mainImage = document.getElementById('mainImage');
    const noFileText = document.getElementById('noFileText');

    // File Upload Handler
    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
            const fileId = 'file_' + Date.now();
            filesArray.push({
                id: fileId,
                name: file.name,
                src: event.target.result,
                texts: [],
                lastEditedBy: activeUserSelect.value,
                lastEditedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            switchToFile(fileId);
            renderFileList();
        };
        reader.readAsDataURL(file);
    });

    function renderFileList() {
        fileListContainer.innerHTML = '';
        filesArray.forEach(file => {
            const div = document.createElement('div');
            div.className = `file-item ${file.id === activeFileId ? 'active' : ''}`;
            div.onclick = () => switchToFile(file.id);
            
            div.innerHTML = `
                <div class="file-info">
                    <div class="file-name">${file.name}</div>
                    <span class="file-editor">Edited by: ${file.lastEditedBy || 'None'} @ ${file.lastEditedAt || 'N/A'}</span>
                </div>
            `;
            fileListContainer.appendChild(div);
        });
    }

    function switchToFile(id) {
        activeFileId = id;
        const file = filesArray.find(f => f.id === id);
        mainImage.src = file.src;
        noFileText.style.display = 'none';
        imageWrapper.style.display = 'inline-block';
        renderFileList();
    }

    // Canvas click to add text
    imageWrapper.addEventListener('click', (e) => {
        if(activeFileId === null) return;
        const rect = imageWrapper.getBoundingClientRect();
        const textBox = document.createElement('div');
        textBox.className = 'text-overlay';
        textBox.contentEditable = 'true';
        textBox.innerText = 'Click to edit...';
        textBox.style.left = (e.clientX - rect.left) + 'px';
        textBox.style.top = (e.clientY - rect.top) + 'px';
        
        textBox.addEventListener('blur', () => {
            const file = filesArray.find(f => f.id === activeFileId);
            file.lastEditedBy = activeUserSelect.value;
            file.lastEditedAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            renderFileList();
        });
        
        imageWrapper.appendChild(textBox);
    });

    document.getElementById('downloadBtn').onclick = () => alert("PDF Export triggered!");
</script>
</body>
</html>
